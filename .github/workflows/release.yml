name: Beta release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/check_repository.py --release
      - run: python tools/build_release.py
      - run: gh release create "$GITHUB_REF_NAME" dist/heatpump_supplytemp_optimizer.zip --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
